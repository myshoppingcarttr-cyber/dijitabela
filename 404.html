<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Dijitabela</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,700..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* 20 Eki 2026 site denetimi: kök Türkçe 404 (GitHub Pages bunu bulunamayan her adres için gösterir) */
  :root { --bg:#ffffff; --fg:#16181D; --mute:#646A75; --line:#E3E0D8; --led:#FFB000; --led-ink:#8A5A00; --soft:#FFF3D6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font-family:"Plus Jakarta Sans",system-ui,sans-serif; padding:24px 16px; }
  main { max-width:560px; width:100%; }
  .tabela { display:inline-block; background:var(--fg); color:var(--led); font-family:"Space Mono",monospace; font-weight:700; letter-spacing:.12em; padding:10px 16px; border-radius:10px; font-size:.95rem; }
  h1 { font-family:"Archivo",sans-serif; font-stretch:75%; font-weight:900; font-size:clamp(2rem,7vw,3rem); line-height:1.05; margin:22px 0 12px; }
  p { color:var(--mute); line-height:1.6; margin:0 0 22px; }
  .yol { display:grid; gap:10px; }
  .yol a { display:flex; justify-content:space-between; gap:12px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; color:var(--fg); text-decoration:none; font-weight:700; }
  .yol a:hover, .yol a:focus-visible { background:var(--soft); border-color:var(--led); outline:none; }
  .yol span { color:var(--led-ink); }
</style>
</head>
<body>
<main>
  <div class="tabela">404 · SAYFA YOK</div>
  <h1>Aradığınız sayfa burada değil.</h1>
  <p>Adres değişmiş ya da yanlış yazılmış olabilir. Size teklif bağlantısı geldiyse süresi dolmuş olabilir; WhatsApp'tan yazın, hemen yenileyelim.</p>
  <nav class="yol" aria-label="Önerilen sayfalar">
    <a href="https://dijitabela.com/">Ana sayfa <span>→</span></a>
    <a href="https://dijitabela.com/calismalarimiz.html">Çalışmalarımız <span>→</span></a>
    <a href="https://dijitabela.com/ekspertiz.html">Ücretsiz dijital ekspertiz <span>→</span></a>
    <a href="https://dijitabela.com/blog.html">Blog <span>→</span></a>
  </nav>
</main>
<script src="/ornek/_dijitabela/filigran.js" defer></script></body>
</html>
