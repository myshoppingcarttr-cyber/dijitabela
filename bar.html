<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bar Ekranı</title>
<script>if(location.protocol==="http:"&&/(^|.)dijitabela.com$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<script src="assets/config.js"></script>
<style>
:root{--zemin:#14100d;--kart:#fffaf3;--yazi:#231915;--soluk:#8c7b6c;--vurgu:#e5c08a;--yesil:#3d8b5f;--kirmizi:#c0533e;--turuncu:#d99a2b}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font-family:"Archivo",system-ui,sans-serif;background:var(--zemin);color:#e9dccb;min-height:100vh}
button,select{font:inherit;cursor:pointer}
.ust{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:#0d0a08;border-bottom:1px solid #2b221b;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.ust b{color:var(--vurgu);font-size:19px}.ust .canli{color:#4cc27a;font-size:13px;font-weight:700;margin-left:10px}
.ust .canli.kop{color:var(--kirmizi)}
.ust select{background:#211913;color:#fff;border:1px solid #3a2d24;border-radius:10px;padding:8px 10px;font-size:15px}
.ust .sag{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ust .s{background:#211913;border-radius:10px;padding:6px 12px;font-size:13px}.ust .s b{font-size:17px;color:#fff;margin-right:4px}
.kucuk{background:#211913;color:#e9dccb;border:1px solid #3a2d24;border-radius:10px;padding:8px 12px;font-size:14px;text-decoration:none}
.ses{background:var(--turuncu);color:#1a110c;border:0;font-weight:800}
.kolonlar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px}
.kolon h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--soluk);margin-bottom:10px;display:flex;justify-content:space-between}
.kolon h2 span{background:#2b221b;color:#fff;border-radius:10px;padding:0 9px}
.fis{background:var(--kart);color:var(--yazi);border-radius:14px;padding:12px 14px;margin-bottom:12px;border-left:6px solid var(--vurgu);animation:dus .45s cubic-bezier(.2,.8,.2,1)}
.fis.yeni-gelen{box-shadow:0 0 0 3px var(--vurgu),0 0 30px rgba(229,192,138,.5)}
.fis.gec{border-left-color:var(--kirmizi)}
@keyframes dus{from{opacity:0;transform:translateY(-16px)}}
.fis .b{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed #cdbba3;padding-bottom:6px;margin-bottom:6px}
.fis .b b{font-size:22px}.fis .b span{font-family:"JetBrains Mono",monospace;font-size:13px;color:#6b4430}
.fis ul{list-style:none;font-size:16px}.fis li{padding:2px 0}.fis li small{color:#6e625a;font-size:13.5px}
.fis .not{color:var(--kirmizi);font-style:italic;font-size:14px;margin-top:4px}
.fis .alt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:#6e625a}
.fis .sure{font-family:"JetBrains Mono",monospace;font-weight:600}.fis.gec .sure{color:var(--kirmizi)}
.fis .btns{display:flex;gap:6px;margin-top:10px}
.fis .btns button{flex:1;border:0;border-radius:10px;padding:12px 8px;font-weight:800;font-size:15px;background:#2a1b14;color:#fff}
.fis .btns .hz{background:var(--yesil)}.fis .btns .ip{flex:none;background:#eee4d6;color:var(--kirmizi);padding:12px}
.bos{border:1px dashed #3a2d24;border-radius:14px;padding:26px 10px;text-align:center;color:var(--soluk);font-size:14px}
.cekmece{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:flex-end;z-index:20}
.cekmece .ic{background:#1b1410;width:min(420px,100%);height:100%;overflow-y:auto;padding:18px}
.cekmece h3{color:var(--vurgu);margin-bottom:4px}.cekmece p{color:var(--soluk);font-size:13.5px;margin-bottom:12px}
.tk{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2b221b}
.tk small{color:var(--soluk);display:block;font-size:12px}
.tk button{border:0;border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px;background:#2b4a3a;color:#bfe8cf}
.tk button.yok{background:#4a2420;color:#ffb3a7}
.giris{max-width:460px;margin:80px auto;text-align:center;padding:20px}
.giris b{color:var(--vurgu);font-size:22px;display:block;margin-bottom:10px}
.giris button{margin-top:16px;background:var(--turuncu);color:#1a110c;border:0;border-radius:12px;padding:14px 22px;font-weight:800;font-size:16px}
@media(max-width:900px){.kolonlar{grid-template-columns:1fr}}
</style></head><body>
<div class="giris" id="giris"><b>Bar Ekranı</b>Yeni siparişlerde ses çalabilmesi için ekrana bir kez dokunun.<br><button id="baslat">Bar ekranını aç</button></div>
<div id="ana" hidden>
 <div class="ust"><div><b id="isletme">—</b><span class="canli" id="canli">● canlı</span></div>
  <div class="sag"><select id="sube"></select><span class="s"><b id="bugun">0</b>bugün</span><button class="kucuk ses" id="kartBtn" style="background:#e5c08a">☕ Sadakat kartı</button><button class="kucuk" id="tukBtn">Tükenenler</button><a class="kucuk" id="qrLink" target="_blank">Masa QR kartları</a><button class="kucuk ses" id="sesBtn">🔔 Ses açık</button></div></div>
 <div class="kolonlar">
  <div class="kolon"><h2>Yeni <span id="n-yeni">0</span></h2><div id="k-yeni"></div></div>
  <div class="kolon"><h2>Hazırlanıyor <span id="n-hazirlaniyor">0</span></h2><div id="k-hazirlaniyor"></div></div>
  <div class="kolon"><h2>Hazır · teslim bekliyor <span id="n-hazir">0</span></h2><div id="k-hazir"></div></div>
 </div>
</div>
<div class="cekmece" id="kartC" hidden><div class="ic"><h3>Sadakat kartı</h3><p>Misafirin kartındaki 6 haneli kodu girin.</p><input id="kKod" maxlength="6" autocomplete="off" style="width:100%;font:600 28px JetBrains Mono,monospace;letter-spacing:.2em;text-transform:uppercase;padding:10px;border-radius:12px;border:1px solid #3a2d24;background:#211913;color:#fff;text-align:center"><button class="kucuk" id="kBul" style="width:100%;margin-top:10px;padding:12px">Kartı bul</button><div id="kSonuc" style="margin-top:14px"></div><button class="kucuk" style="margin-top:14px" onclick="kartC.hidden=true">Kapat</button></div></div>
<div class="cekmece" id="cekmece" hidden><div class="ic"><h3>Tükenen ürünler</h3><p>Tükenen ürünü kapatın; bu şubenin QR menüsünden hemen kalkar.</p><div id="tkListe"></div><button class="kucuk" style="margin-top:14px" onclick="cekmece.hidden=true">Kapat</button></div></div>
<script>
const A=window.AJANS,SB=A.supabaseUrl,KEY=A.supabaseAnonKey,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const q=new URLSearchParams(location.search),TOKEN=q.get("t")||"";
const rpc=p=>fetch(SB+"/rest/v1/rpc/qr_bar",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify({p:Object.assign({token:TOKEN},p)})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||r.status);return j;});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const oku=k=>{try{return localStorage.getItem(k)}catch{return null}},yaz=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let IMZA="";let SUBE=q.get("s")||oku("bar-sube-"+TOKEN)||"",VERI=null,GORULEN=new Set(),ILK=true,SES=oku("bar-ses")!=="0",AC=null;
function bip(){if(!SES)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=[880,1175,1568][i];g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.4,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.25);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.3);});}catch{}}
$("#baslat").onclick=()=>{try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch{}$("#giris").hidden=true;$("#ana").hidden=false;yukle();setInterval(yukle,4000);setInterval(sureler,1000);};
$("#sesBtn").textContent=SES?"🔔 Ses açık":"🔕 Ses kapalı";$("#sesBtn").onclick=()=>{SES=!SES;yaz("bar-ses",SES?"1":"0");$("#sesBtn").textContent=SES?"🔔 Ses açık":"🔕 Ses kapalı";if(SES)bip();};
$("#sube").onchange=e=>{SUBE=e.target.value;IMZA="";yaz("bar-sube-"+TOKEN,SUBE);GORULEN=new Set();ILK=true;yukle();};
async function yukle(ek){try{VERI=await rpc(Object.assign({sube:SUBE},ek||{}));$("#canli").textContent="● canlı";$("#canli").classList.remove("kop");ciz();}catch(e){$("#canli").textContent="● bağlantı yok";$("#canli").classList.add("kop");if(/Geçersiz/.test(e.message)){document.body.innerHTML='<div class="giris"><b>Geçersiz bar linki</b>Dijitabela: 0501 945 21 84</div>';}}}
function ciz(){$("#isletme").textContent=VERI.isletme;document.title=VERI.isletme+" · Bar";
 if(!$("#sube").options.length){$("#sube").innerHTML=`<option value="">Şube seçin</option>`+VERI.subeler.map(s=>`<option value="${s.id}">${esc(s.ad)}</option>`).join("");}
 if(!SUBE){const b=VERI.subeler.find(s=>s.ad==="Bestekar")||VERI.subeler[0];SUBE=b.id;yaz("bar-sube-"+TOKEN,SUBE);return yukle();}
 $("#sube").value=SUBE;$("#bugun").textContent=VERI.bugun;$("#qrLink").href="qr-kart.html?t="+TOKEN+"&s="+SUBE;
 const imza=JSON.stringify([SUBE,VERI.siparisler.map(s=>[s.id,s.durum,s.puan])]);if(imza===IMZA){tukCiz();return;}IMZA=imza;
 let yeniVar=false;
 for(const d of ["yeni","hazirlaniyor","hazir"]){const l=VERI.siparisler.filter(s=>s.durum===d);$("#n-"+d).textContent=l.length;
  $("#k-"+d).innerHTML=l.length?l.map(s=>{const yeni=!GORULEN.has(s.id)&&!ILK;if(!GORULEN.has(s.id)){GORULEN.add(s.id);if(!ILK&&d==="yeni")yeniVar=true;}
   return `<div class="fis${yeni?" yeni-gelen":""}" data-id="${s.id}" data-t="${s.olusturma}"><div class="b"><b>Masa ${esc(s.masa||"-")}</b><span>#${s.no} · ${new Date(s.olusturma).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</span></div>
    <ul>${s.kalemler.map(k=>`<li><b>${k.adet}×</b> ${esc(k.ad)}${Object.keys(k.secim||{}).length?` <small>(${esc(Object.values(k.secim).join(", "))})</small>`:""}</li>`).join("")}</ul>
    ${s.not?`<div class="not">Not: ${esc(s.not)}</div>`:""}
    <div class="alt"><span>${s.odeme==="kart"?"✓ Kartla ödendi":"Kasada ödenecek"} · ${Number(s.toplam).toLocaleString("tr-TR")} ₺${s.puan?` · 🎮 ${s.puan} puan`:""}</span><span class="sure">0:00</span></div>
    <div class="btns">${d==="yeni"?`<button data-d="hazirlaniyor">Hazırla</button>`:d==="hazirlaniyor"?`<button class="hz" data-d="hazir">Hazır · misafire bildir</button>`:`<button data-d="teslim">Teslim edildi</button>`}<button class="ip" data-d="iptal" title="İptal">✕</button></div></div>`}).join(""):`<div class="bos">${{yeni:"Yeni sipariş yok",hazirlaniyor:"Hazırlanan sipariş yok",hazir:"Bekleyen yok"}[d]}</div>`;}
 $$(".fis .btns button").forEach(b=>b.onclick=()=>{const id=b.closest(".fis").dataset.id;if(b.dataset.d==="iptal"&&!confirmIptal(b))return;b.disabled=true;yukle({id,durum:b.dataset.d});});
 if(yeniVar){bip();if(navigator.vibrate)navigator.vibrate(200);}
 ILK=false;sureler();tukCiz();}
function confirmIptal(b){if(b.dataset.onay)return true;b.dataset.onay=1;b.textContent="İptal?";b.style.width="auto";setTimeout(()=>{delete b.dataset.onay;b.textContent="✕";},3000);return false;}
function sureler(){$$(".fis").forEach(f=>{const s=(Date.now()-new Date(f.dataset.t))/1000,m=Math.floor(s/60);f.querySelector(".sure").textContent=m+":"+String(Math.floor(s%60)).padStart(2,"0");f.classList.toggle("gec",m>=8&&!f.closest("#k-hazir"));});}
const kartRpc=p=>fetch(SB+"/rest/v1/rpc/kart_bar",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify({p:Object.assign({token:TOKEN,sube:SUBE},p)})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||r.status);return j;});
function kartGoster(k){$("#kSonuc").innerHTML=`<div style="background:#fffaf3;color:#231915;border-radius:12px;padding:14px"><b style="font-size:18px">${esc(k.ad||"Misafir")}</b> · <span style="font-family:JetBrains Mono,monospace">${k.kod}</span><div style="font-size:30px;font-weight:800;margin:6px 0">${k.damga}/${k.hedef} ☕</div>${k.damga>=k.hedef?`<div style="color:#3d8b5f;font-weight:800;margin-bottom:8px">🎁 Hediye hakkı var: ${esc(k.odul)}</div>`:""}<div style="display:flex;gap:6px"><button class="kucuk ses" id="kDamga" style="flex:1;padding:12px">+1 damga</button>${k.damga>=k.hedef?`<button class="kucuk" id="kOdul" style="flex:1;padding:12px;background:#3d8b5f;color:#fff;border:0">Hediyeyi kullan</button>`:""}</div></div>`;
 $("#kDamga").onclick=async()=>{try{kartGoster(await kartRpc({kod:k.kod,islem:"damga"}));bip();}catch(e){$("#kSonuc").insertAdjacentHTML("beforeend",`<p style="color:#ffb3a7;margin-top:8px">${esc(e.message)}</p>`);}};
 if($("#kOdul"))$("#kOdul").onclick=async()=>{try{kartGoster(await kartRpc({kod:k.kod,islem:"odul"}));}catch(e){alert(e.message);}};}
$("#kartBtn").onclick=()=>{$("#kartC").hidden=false;$("#kKod").value="";$("#kSonuc").innerHTML="";$("#kKod").focus();};
$("#kBul").onclick=async()=>{try{kartGoster(await kartRpc({kod:$("#kKod").value.trim().toUpperCase()}));}catch(e){$("#kSonuc").innerHTML=`<p style="color:#ffb3a7">${esc(e.message)}</p>`;}};
$("#kKod").onkeydown=e=>{if(e.key==="Enter")$("#kBul").click();};
$("#tukBtn").onclick=()=>{$("#cekmece").hidden=false;tukCiz();};
function tukCiz(){if($("#cekmece").hidden||!VERI)return;$("#tkListe").innerHTML=VERI.urunler.map(u=>`<div class="tk"><div>${esc(u.ad)}<small>${esc(u.kategori)}</small></div><button class="${u.tukendi?"yok":""}" data-u="${u.id}" data-v="${u.tukendi?0:1}">${u.tukendi?"Tükendi · aç":"Var · kapat"}</button></div>`).join("");
 $$("#tkListe button").forEach(b=>b.onclick=()=>{b.disabled=true;yukle({urun:b.dataset.u,tukendi:b.dataset.v==="1"});});}
if(!/^[0-9a-f-]{36}$/.test(TOKEN))document.body.innerHTML='<div class="giris"><b>Geçersiz bar linki</b>Dijitabela: 0501 945 21 84</div>';
</script>
</body></html>
