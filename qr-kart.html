<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Masa QR Kartları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="assets/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@page{size:A4;margin:8mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Archivo",sans-serif;background:#e9e4dc;color:#231915}
.arac{max-width:900px;margin:16px auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 12px;flex-wrap:wrap}
.arac button{border:0;background:#2a1b14;color:#fff;border-radius:10px;padding:11px 16px;font-weight:800;font-size:15px;cursor:pointer}
.sayfa{width:194mm;margin:0 auto 12px;display:grid;grid-template-columns:1fr 1fr;gap:6mm;background:#fff;padding:6mm;page-break-after:always}
.kart{border:1.5px dashed #c9b394;border-radius:5mm;padding:7mm 6mm;text-align:center;height:88mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#fffaf3;break-inside:avoid}
.kart img.logo{height:12mm;width:auto}
.kart .bas{font-family:"Playfair Display",serif;font-size:17pt;color:var(--ana,#2a1b14);line-height:1.1}
.kart .qr{width:36mm;height:36mm}.kart .qr img,.kart .qr canvas{width:36mm!important;height:36mm!important}
.kart .masa{font-size:20pt;font-weight:800;font-variation-settings:"wdth" 75}
.kart small{font-size:8.5pt;color:#6e625a;line-height:1.3}
@media print{body{background:#fff}.arac{display:none}.sayfa{margin:0;padding:0;width:auto}}
</style></head><body>
<div class="arac"><div><b id="baslik">Yükleniyor…</b><br><small>Kartları yazdırıp masalara koyun. Her QR yalnızca kendi masasını açar.</small></div><button onclick="print()">Yazdır / PDF</button></div>
<div id="kartlar"></div>
<script>
const A=window.AJANS,SB=A.supabaseUrl,KEY=A.supabaseAnonKey,q=new URLSearchParams(location.search);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KOK=/^https?:/.test(location.protocol)?location.origin:"https://dijitabela.com";
fetch(SB+"/rest/v1/rpc/qr_bar",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify({p:{token:q.get("t")||"",sube:q.get("s")||""}})})
.then(r=>r.ok?r.json():Promise.reject()).then(v=>{const sube=(v.subeler.find(s=>s.id===q.get("s"))||{}).ad||"";
 document.getElementById("baslik").textContent=v.isletme+" · "+sube+" · "+v.masalar.length+" masa";
 const logo="https://cdn.myikas.com/images/theme-images/d2eb8104-d210-4a7e-8aa2-904729b0317d/image_180.webp";
 const s=[];for(let i=0;i<v.masalar.length;i+=6)s.push(v.masalar.slice(i,i+6));
 document.getElementById("kartlar").innerHTML=s.map(g=>`<div class="sayfa">${g.map(m=>`<div class="kart"><img class="logo" src="${logo}" alt=""><div class="bas">Masadan sipariş</div><div class="qr" data-k="${m.kod}"></div><div class="masa">Masa ${esc(m.no)}</div><small>${esc(sube)} · Kamerayla okutun, menüden seçin,<br>sıra beklemeden siparişiniz masanıza gelsin ☕</small></div>`).join("")}</div>`).join("");
 document.querySelectorAll(".qr").forEach(e=>new QRCode(e,{text:KOK+"/siparis.html?m="+e.dataset.k,width:300,height:300,colorDark:"#2a1b14",colorLight:"#fffaf3",correctLevel:QRCode.CorrectLevel.M}));
}).catch(()=>document.getElementById("baslik").textContent="Geçersiz link");
</script>
</body></html>
