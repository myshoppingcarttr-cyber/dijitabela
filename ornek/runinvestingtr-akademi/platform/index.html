<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RunInvestingTR Akademi · Üye Platformu</title>
<meta name="description" content="RunInvestingTR Akademi üye platformu: eğitim arşivi, SPL soru bankası, dokümanlar, canlı eğitim ve rütbeli yatırımcı forumu.">
<meta name="theme-color" content="#0b0d12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gece:#0b0d12;--panel:#13161d;--panel2:#1a1e27;--cizgi:#262b36;--y:#edeff3;--s:#9aa1ae;--k:#e5322d;--m:#2b7fff;--iyi:#17b26a;--alt:#f5b301;
--bas:"Archivo",sans-serif;--mono:"Space Mono",monospace;--pad:clamp(16px,4vw,48px);--r:14px}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{background:var(--gece);color:var(--y);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.kap{max-width:1240px;margin:0 auto;padding:0 var(--pad)}
.mono{font:700 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--s)}
.bas{font-family:var(--bas);font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:-.005em}
h1.bas{font-size:clamp(40px,6vw,76px)}h2.bas{font-size:clamp(28px,3.6vw,44px)}h3{font-size:19px;line-height:1.3}
.s{color:var(--s)}.k{color:var(--k)}.m{color:var(--m)}.iyi{color:var(--iyi)}.alt{color:var(--alt)}
/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:2px solid var(--y);font-weight:800;font-size:14px;cursor:pointer;background:transparent;border-radius:0;transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:var(--y);color:var(--gece)}
.btn.ana{background:var(--k);border-color:var(--k);color:#fff}.btn.ana:hover{background:#fff;border-color:#fff;color:var(--k)}
.btn.mavi{background:var(--m);border-color:var(--m);color:#fff}.btn.mavi:hover{background:#fff;border-color:#fff;color:var(--m)}
.btn.kucuk{min-height:36px;padding:0 14px;font-size:13px;border-width:1.5px}
.btn.hayalet{border-color:var(--cizgi)}.btn.hayalet:hover{border-color:var(--y)}
.btn[disabled]{opacity:.45;pointer-events:none}
/* üst menü */
header.ust{position:sticky;top:0;z-index:50;background:rgba(11,13,18,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--cizgi)}
.ust .kap{display:flex;align-items:center;gap:22px;height:68px}
.logo{display:flex;flex-direction:column;line-height:1;flex:none}.logo b{font:900 23px var(--bas);font-stretch:75%}.logo .r{color:var(--k)}.logo .i{color:var(--m)}
.logo small{font:700 8px var(--mono);letter-spacing:.5em;color:var(--s);margin-top:4px}
.ust nav{display:flex;gap:4px;margin-left:auto;font-weight:700;font-size:14px}
.ust nav a{padding:8px 11px;color:#c8ccd4;border-bottom:2px solid transparent}.ust nav a:hover{color:#fff}.ust nav a.aktif{color:#fff;border-color:var(--k)}
.kim{display:flex;align-items:center;gap:10px;flex:none}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--bas);background:var(--panel2);border:1px solid var(--cizgi)}
.menu-btn{display:none;background:none;border:1px solid var(--cizgi);width:42px;height:42px;cursor:pointer;font-size:20px}
@media(max-width:1060px){.ust nav{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--gece);border-bottom:1px solid var(--cizgi);padding:10px var(--pad) 18px}.ust nav.acik{display:flex}.menu-btn{display:block;margin-left:auto}.kim .ad-yazi{display:none}}
/* sayfa */
main{padding:36px 0 90px;min-height:70vh}
.sayfa-bas{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sayfa-bas p{max-width:640px;margin-top:10px}
.izgara{display:grid;gap:16px}
.i2{grid-template-columns:repeat(2,minmax(0,1fr))}.i3{grid-template-columns:repeat(3,minmax(0,1fr))}.i4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.i3,.i4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.i2,.i3,.i4{grid-template-columns:1fr}}
.kart{background:var(--panel);border:1px solid var(--cizgi);border-radius:var(--r);padding:22px;position:relative;min-width:0}
.kart.tik{cursor:pointer;transition:border-color .2s,transform .2s}.kart.tik:hover{border-color:var(--m);transform:translateY(-2px)}
.kart h3+p{margin-top:6px}
.etiket{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--cizgi);color:var(--s)}
.etiket.altin{color:var(--alt);border-color:rgba(245,179,1,.35);background:rgba(245,179,1,.08)}
.etiket.yesil{color:var(--iyi);border-color:rgba(23,178,106,.35);background:rgba(23,178,106,.08)}
.etiket.kirmizi{color:#ff6b66;border-color:rgba(229,50,45,.4);background:rgba(229,50,45,.1)}
.etiket.mavi{color:#7fb0ff;border-color:rgba(43,127,255,.4);background:rgba(43,127,255,.1)}
.sayi-buyuk{font:900 44px/1 var(--bas);font-stretch:70%}
.cubuk{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.cubuk i{display:block;height:100%;background:linear-gradient(90deg,var(--m),var(--iyi));border-radius:99px}
.satir{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ayir{height:1px;background:var(--cizgi);margin:18px 0}
/* kilit */
.kilitli{position:relative}
.kilit-perde{position:absolute;inset:0;background:rgba(11,13,18,.72);backdrop-filter:blur(3px);border-radius:var(--r);display:grid;place-items:center;text-align:center;padding:20px;z-index:2}
.kilit-perde b{display:block;font-size:17px;margin:6px 0}
/* program/ders */
.program{display:grid;grid-template-columns:200px 1fr;overflow:hidden;padding:0}
.program .gorsel{background-size:cover;background-position:center;min-height:170px}
.program .ic{padding:22px}
@media(max-width:620px){.program{grid-template-columns:1fr}.program .gorsel{min-height:120px}}
.sekmeler{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.sekme{padding:10px 16px;border:1px solid var(--cizgi);border-radius:10px;background:var(--panel);font-weight:700;font-size:14px;cursor:pointer}
.sekme.aktif{border-color:var(--alt);color:var(--alt);background:rgba(245,179,1,.06)}
.sekme .rozet{display:inline-block;margin-left:6px;font:700 11px var(--mono);background:var(--panel2);padding:1px 7px;border-radius:99px;color:var(--s)}
.ders{display:flex;align-items:center;gap:16px;padding:16px 20px;cursor:pointer}
.ders .no{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--panel2);font:800 15px var(--bas);color:var(--alt)}
.ders .no.bitti{background:var(--iyi);color:#fff}
.ders .ok{margin-left:auto;color:var(--m);font-size:20px}
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--cizgi)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .bos{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle at 50% 40%,#1b2130,#07080b)}
/* form */
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-weight:700;font-size:14px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=url],input[type=datetime-local],input[type=number],select,textarea{width:100%;background:var(--gece);border:1px solid var(--cizgi);border-radius:10px;padding:12px 14px;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--m)}
textarea{min-height:110px;resize:vertical}
.secim{display:flex;flex-wrap:wrap;gap:8px}
.secim label{display:flex;align-items:center;gap:8px;font-weight:600;border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;cursor:pointer}
.secim input{accent-color:var(--k)}
.onay{display:flex!important;grid-template-columns:none!important;align-items:flex-start;gap:10px!important;font-weight:500!important;color:var(--s)}
.onay input{margin-top:4px;accent-color:var(--k)}
.uyari{padding:12px 14px;border-radius:10px;background:rgba(43,127,255,.08);border:1px solid rgba(43,127,255,.3);font-size:14px}
.uyari.sari{background:rgba(245,179,1,.07);border-color:rgba(245,179,1,.3)}
/* paket */
.paket{display:flex;flex-direction:column;gap:14px}
.paket.one{border-color:var(--k);box-shadow:0 0 0 1px var(--k),0 20px 60px -30px rgba(229,50,45,.6)}
.paket .fiyat{font:900 46px/1 var(--bas);font-stretch:70%}
.paket ul{list-style:none;padding:0;display:grid;gap:8px;font-size:15px}
.paket li::before{content:"✓";color:var(--iyi);font-weight:800;margin-right:9px}
.paket .btn{margin-top:auto}
/* sınav */
.sinav{max-width:760px}
.sik{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--cizgi);border-radius:12px;background:var(--panel2);cursor:pointer;margin-top:10px;font-weight:600;transition:border-color .15s}
.sik:hover{border-color:var(--m)}.sik.dogru{border-color:var(--iyi);background:rgba(23,178,106,.12)}.sik.yanlis{border-color:var(--k);background:rgba(229,50,45,.12)}
.sik.secili{border-color:var(--m);background:rgba(43,127,255,.12)}
.sure{font:700 15px var(--mono)}
/* forum */
.konu-satir{display:flex;gap:14px;align-items:center;padding:16px 20px;cursor:pointer}
.konu-satir .sag{margin-left:auto;text-align:right;flex:none}
.gonderi{display:grid;grid-template-columns:150px 1fr;gap:0;padding:0;overflow:hidden}
.gonderi .yazar{padding:18px;border-right:1px solid var(--cizgi);background:var(--panel2);text-align:center;display:grid;gap:6px;justify-items:center;align-content:start}
.gonderi .metin{padding:18px 20px;white-space:pre-wrap;word-wrap:break-word;min-width:0}
@media(max-width:620px){.gonderi{grid-template-columns:1fr}.gonderi .yazar{border-right:0;border-bottom:1px solid var(--cizgi);display:flex;justify-content:flex-start;text-align:left}}
.begeni{background:none;border:1px solid var(--cizgi);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:13px}
.begeni.var{border-color:var(--k);color:#ff6b66}
.tv{height:420px;border-radius:12px;overflow:hidden;border:1px solid var(--cizgi);margin-top:12px}.tv iframe{width:100%;height:100%;border:0}
/* tablo */
.tablo-kap{overflow-x:auto;border:1px solid var(--cizgi);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
th,td{padding:11px 12px;border-bottom:1px solid var(--cizgi);text-align:left;vertical-align:middle}
th{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--s);background:var(--panel2)}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--iyi)}
/* canlı */
.geri-sayim{display:flex;gap:10px}.geri-sayim div{background:var(--panel2);border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;text-align:center;min-width:64px}
.geri-sayim b{display:block;font:900 30px/1 var(--bas);font-stretch:70%}.geri-sayim span{font:700 10px var(--mono);color:var(--s)}
.canli-nokta{width:10px;height:10px;border-radius:50%;background:var(--k);display:inline-block;animation:nab 1.4s infinite}
@keyframes nab{0%{box-shadow:0 0 0 0 rgba(229,50,45,.7)}70%{box-shadow:0 0 0 10px rgba(229,50,45,0)}100%{box-shadow:0 0 0 0 rgba(229,50,45,0)}}
.oda{display:grid;grid-template-columns:1fr 340px;gap:16px}@media(max-width:900px){.oda{grid-template-columns:1fr}}
.sohbet{display:flex;flex-direction:column;height:100%;min-height:420px;padding:0}
.sohbet .akis{flex:1;overflow-y:auto;padding:16px;display:grid;gap:10px;align-content:start;max-height:520px}
.sohbet form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--cizgi)}
/* bildirim */
#tost{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--y);color:var(--gece);font-weight:800;padding:13px 20px;border-radius:12px;z-index:200;transition:transform .35s;max-width:calc(100vw - 32px)}
#tost.gor{transform:translateX(-50%) translateY(0)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:grid;place-items:center;padding:16px}
.modal .kart{max-width:520px;width:100%;max-height:90vh;overflow:auto}
footer{border-top:1px solid var(--cizgi);padding:28px 0;color:var(--s);font-size:13px}
footer .kap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.demo-serit{background:linear-gradient(90deg,rgba(43,127,255,.15),rgba(229,50,45,.12));border-bottom:1px solid var(--cizgi);font-size:13px;padding:8px 0;text-align:center}
.demo-serit button{background:none;border:0;color:#7fb0ff;font-weight:800;cursor:pointer;text-decoration:underline;margin:0 4px}
.bos-durum{text-align:center;padding:40px 20px;color:var(--s)}
</style>
</head><body>
<div class="demo-serit" id="demo-serit"></div>
<header class="ust"><div class="kap">
  <a href="../1-terminal/" class="logo" title="Ana sayfa"><b><span class="r">Run</span><span class="i">InvestingTR</span></b><small>AKADEMİ</small></a>
  <button class="menu-btn" id="menu-btn" aria-label="Menü">☰</button>
  <nav id="nav"></nav>
  <div class="kim" id="kim"></div>
</div></header>
<main><div class="kap" id="sayfa"></div></main>
<footer><div class="kap"><span>© 2026 RunInvestingTR Akademi · Bilginin değere, disiplinin başarıya dönüştüğü yer.</span><span>Burada yer alan bilgiler yatırım tavsiyesi değildir.</span></div></footer>
<div id="tost"></div>
<script src="veri.js"></script>
<script src="app.js"></script>
<script src="/ornek/_dijitabela/izle.js" defer></script><script src="/ornek/_dijitabela/tabela-oto.js" defer></script></body></html>
