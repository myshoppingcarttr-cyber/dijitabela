 else if(adim===1){h+='<span class="et">2 / 4</span><h2>'+D.t("adim2")+'</h2><p class="al">'+(T()?'This helps the clinic plan.':'Kliniğin planlamasına yardımcı olur.')+'</p><div class="ch" id="ac">'+[0,1,2,3].map(function(i){return '<button data-a="'+i+'" class="'+(aci===i?"a":"")+'">'+D.ac(i)+'</button>'}).join("")+'</div>'}
