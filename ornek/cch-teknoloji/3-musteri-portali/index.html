<!doctype html>
<html lang="tr"><head><script src="/ornek/_sure.js" data-bitis="2026-10-11T23:59:00+03:00" data-slug="cch-teknoloji"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CCH Teknoloji · Müşteri ve Servis Portalı</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--k:#fff;--k2:#f6f7f9;--y:#101317;--g:#5e6676;--c:#e1e4e9;--a:#ff6a1a;--d:#12161b;--ok:#16a34a;--uy:#d97706;--hata:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0c0f13;--k:#151a20;--k2:#1b2129;--y:#eef1f5;--g:#9aa3b0;--c:#27303a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--y);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.15;margin:0 0 10px}
.prot{background:var(--d);color:#ffb37a;font-size:13px;font-weight:700;text-align:center;padding:8px}.prot a{color:#fff}
.mod{display:flex;justify-content:center;gap:8px;padding:14px;flex-wrap:wrap}
.mod button{border:1px solid var(--c);background:var(--k);color:var(--y);border-radius:99px;padding:9px 16px;font:700 14px Inter;cursor:pointer}.mod button.s{background:var(--a);border-color:var(--a);color:#fff}
.uyg{max-width:1240px;margin:0 auto 60px;display:flex;background:var(--k);border:1px solid var(--c);border-radius:20px;overflow:hidden;min-height:760px;box-shadow:0 20px 60px rgba(0,0,0,.08)}
.yan{width:230px;background:var(--d);color:#c7cdd6;padding:18px 12px;flex:none}
.yan .lg{font:700 20px "Space Grotesk";color:#fff;margin:2px 8px 4px}.yan .lg b{color:var(--a)}.yan small{display:block;margin:0 8px 18px;color:#7d8794}
.yan button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;color:#c7cdd6;padding:10px 12px;border-radius:10px;font:600 14px Inter;cursor:pointer;margin-bottom:2px}
.yan button.s{background:rgba(255,255,255,.09);color:#fff}.yan .say{margin-left:auto;background:var(--a);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.ic{flex:1;padding:24px;min-width:0;overflow:auto}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 14px;font:700 14px Inter;cursor:pointer;background:var(--a);color:#fff}.btn.ik{background:var(--k2);color:var(--y);border:1px solid var(--c)}.btn.kc{padding:6px 10px;font-size:12px}
.k{background:var(--k);border:1px solid var(--c);border-radius:16px;padding:16px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi div{background:var(--k2);border:1px solid var(--c);border-radius:14px;padding:14px}.kpi b{display:block;font:700 26px "Space Grotesk"}
.g{color:var(--g)}.cip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--k2);border:1px solid var(--c)}
.cip.ok{background:rgba(22,163,74,.12);color:var(--ok);border-color:transparent}.cip.uy{background:rgba(217,119,6,.14);color:var(--uy);border-color:transparent}.cip.h{background:rgba(220,38,38,.12);color:var(--hata);border-color:transparent}.cip.a{background:rgba(255,106,26,.13);color:var(--a);border-color:transparent}
.makine{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mk{border:1px solid var(--c);border-radius:16px;overflow:hidden;background:var(--k)}.mk .f{background:#fff;height:170px;display:grid;place-items:center}.mk .f img{max-height:160px;max-width:90%}
.mk .ic2{padding:14px}.bar{height:8px;background:var(--c);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#4ade80)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--g);font-weight:600;padding:9px;border-bottom:1px solid var(--c)}td{padding:10px 9px;border-bottom:1px solid var(--c);vertical-align:top}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form>*{width:100%}
.form select,.form input,.form textarea{background:var(--k2);border:1px solid var(--c);color:var(--y);border-radius:10px;padding:10px;font:14px Inter}.form textarea{grid-column:1/-1;min-height:80px}
.huni{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kol{background:var(--k2);border:1px solid var(--c);border-radius:14px;padding:10px;min-height:220px}
.kol h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between}.kart{background:var(--k);border:1px solid var(--c);border-radius:10px;padding:9px;margin-bottom:8px;font-size:13px}
.iki{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,150px);background:#111;color:#fff;padding:13px 18px;border-radius:12px;z-index:90;transition:.35s;font-size:14px;max-width:calc(100vw - 32px)}.toast.ac{transform:translate(-50%,0)}
.uyari{border-left:4px solid var(--a);background:rgba(255,106,26,.07);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
@media(max-width:980px){.yan{width:66px}.yan .lg,.yan small,.yan span.t{display:none}.makine,.kpi{grid-template-columns:1fr 1fr}.huni{grid-template-columns:repeat(5,220px);overflow-x:auto}.iki{grid-template-columns:1fr}}
@media(max-width:600px){.uyg{border-radius:0;flex-direction:column}.yan{width:100%;display:flex;overflow-x:auto;padding:8px}.yan button{flex:none;width:auto}.makine,.form{grid-template-columns:1fr}.ic{padding:14px}table{display:block;overflow-x:auto}}
</style></head><body>
<div class="prot">Dijitabela tarafından CCH Teknoloji için hazırlanmış çalışan prototip · <a href="../">← 3 seçeneğe dön</a></div>
<div class="mod"><button id="m-mus" class="s" onclick="mod('mus')">👤 Müşteri portalı (makine sahibi)</button><button id="m-pan" onclick="mod('pan')">🏭 CCH yönetim paneli</button></div>
<div class="uyg"><div class="yan" id="yan"></div><div class="ic" id="ic"></div></div>
<div class="toast" id="toast"></div>
<script src="../ortak/veri.js"></script>
<script>
const $=s=>document.querySelector(s);function toast(t){const x=$("#toast");x.innerHTML=t;x.classList.add("ac");clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove("ac"),3200)}
const bugun=new Date();const gun=n=>new Date(bugun.getTime()+n*864e5).toLocaleDateString("tr-TR");
const MAK=[{m:"m50",seri:"CCH-M50-2511-0187",kur:-210,saat:1840,bakim:12},{m:"m30",seri:"CCH-M30-2602-0412",kur:-95,saat:640,bakim:45},{m:"d400",seri:"CCH-D400-2511-0033",kur:-560,saat:3120,bakim:-3}];
let TALEP=[{no:"SRV-2291",mak:"M50",kat:"Nozül tıkanması",dur:"Teknisyen yolda",tar:gun(-1)},{no:"SRV-2244",mak:"D-400",kat:"Periyodik bakım",dur:"Tamamlandı",tar:gun(-20)}];
const STOK=[["CCH PLA+ 1 kg (Siyah)",142,142],["CCH PLA+ CF15 1 kg",38,38],["Porima TPU 1 kg",0,2],["3D Layer Hider 250 g",64,64],["Tabla Yapıştırıcısı Pro",17,21],["Tamu V1 Turbo Hotend",9,9],["M50 Nozül Seti 0,4–1,0",3,3]];
let MOD="mus",SEK="";
const MENU={mus:[["mak","🖨️","Makinelerim"],["srv","🛠️","Servis talepleri",1],["sarf","📦","Sarf & yedek parça"],["kil","📘","Kılavuzlar & eğitim"]],pan:[["ozet","📊","Genel bakış"],["teklif","💼","Teklif hunisi",4],["servis","🛠️","Servis masası",2],["stok","🏷️","Canlı stok"],["garanti","🛡️","Garanti & yenileme"]]};
function mod(m){MOD=m;$("#m-mus").classList.toggle("s",m==="mus");$("#m-pan").classList.toggle("s",m==="pan");$("#yan").innerHTML=`<div class="lg">CCH<b>.</b></div><small>${m==="mus"?"Atlas Kalıp A.Ş. · müşteri":"Yönetim · Murat Yurteri"}</small>`+MENU[m].map(x=>`<button data-s="${x[0]}" onclick="git('${x[0]}')">${x[1]} <span class="t">${x[2]}</span>${x[3]?`<span class="say">${x[3]}</span>`:""}</button>`).join("");git(MENU[m][0][0])}
function git(s){SEK=s;document.querySelectorAll(".yan button").forEach(b=>b.classList.toggle("s",b.dataset.s===s));$("#ic").scrollTop=0;({mak,srv,sarf,kil,ozet,teklif,servis,stok,garanti})[s]()}
const Y=id=>CCH.yazicilar.find(y=>y.id===id);
// ---- MÜŞTERİ ----
function mak(){$("#ic").innerHTML=`<h2>Makinelerim</h2><p class="g">Seri numarası, garanti ve bakım bilgisi tek yerde. Sorun olursa makinenin üzerinden tek tıkla servis çağrılır.</p>
 <div class="makine">${MAK.map((k,i)=>{const y=Y(k.m),gar=730+k.kur,yuz=Math.max(0,gar/730*100);return`<div class="mk"><div class="f"><img src="../img/${y.img}"></div><div class="ic2"><b style="font-size:18px">${y.ad}</b> <span class="cip">${k.seri}</span>
 <div class="g" style="font-size:13px;margin-top:6px">Kurulum: ${gun(k.kur)} · ${k.saat.toLocaleString("tr-TR")} baskı saati</div>
 <div style="font-size:13px;margin-top:8px">Yerinde garanti: <b>${gar>0?gar+" gün kaldı":"bitti"}</b></div><div class="bar"><i style="width:${yuz}%"></i></div>
 <div style="font-size:13px">Periyodik bakım: ${k.bakim<0?`<span class="cip h">${-k.bakim} gün gecikti</span>`:`<span class="cip ok">${k.bakim} gün sonra</span>`}</div>
 <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn kc" onclick="servisAc(${i})">Servis çağır</button><button class="btn ik kc" onclick="git('sarf')">Sarf sipariş</button></div></div></div>`}).join("")}</div>
 <div class="uyari" style="margin-top:16px">🔔 <b>D-400</b> periyodik bakımı 3 gün gecikti. Portal müşteriye ve CCH servis masasına otomatik hatırlattı.</div>`}
function servisAc(i){const k=MAK[i];git("srv");setTimeout(()=>{$("#f-mak").value=Y(k.m).ad},0)}
function srv(){$("#ic").innerHTML=`<h2>Servis talepleri</h2><div class="iki"><div class="k"><h3>Yeni talep</h3><div class="form"><select id="f-mak">${MAK.map(k=>`<option>${Y(k.m).ad}</option>`).join("")}</select><select id="f-kat"><option>Nozül tıkanması</option><option>Tabla seviyeleme</option><option>Ekstrüder / hotend</option><option>Yazılım / dilimleme</option><option>Periyodik bakım</option><option>Diğer</option></select><select><option>Öncelik: Normal</option><option>Öncelik: Üretim durdu (acil)</option></select><input placeholder="İletişim kişisi"><textarea placeholder="Sorunu kısaca yazın; fotoğraf/video ekleyebilirsiniz"></textarea><button class="btn ik" style="justify-content:center" onclick="toast('Fotoğraf eklendi (prototip)')">📷 Fotoğraf / video ekle</button><button class="btn" style="justify-content:center" onclick="talepGonder()">Talebi gönder</button></div></div>
 <div class="k"><h3>Taleplerim</h3><table><tr><th>No</th><th>Makine</th><th>Konu</th><th>Durum</th></tr>${TALEP.map(t=>`<tr><td><b>${t.no}</b><div class="g" style="font-size:12px">${t.tar}</div></td><td>${t.mak}</td><td>${t.kat}</td><td><span class="cip ${t.dur==="Tamamlandı"?"ok":t.dur==="Yeni"?"a":"uy"}">${t.dur}</span></td></tr>`).join("")}</table><p class="g" style="font-size:13px">Her durum değişikliği WhatsApp ve e-postayla bildirilir.</p></div></div>`}
function talepGonder(){const no="SRV-"+(2300+TALEP.length);TALEP.unshift({no,mak:$("#f-mak").value,kat:$("#f-kat").value,dur:"Yeni",tar:gun(0)});toast(`✅ ${no} açıldı · CCH servis masasına düştü · teknisyen 2 saat içinde arayacak`);srv()}
function sarf(){$("#ic").innerHTML=`<h2>Sarf malzeme ve yedek parça</h2><p class="g">Makinenize uyumlu ürünler; stok bilgisi depoyla anlık eşleşir, stokta olmayan ürün sipariş edilemez.</p>
 <div class="k"><table><tr><th>Ürün</th><th>Stok</th><th></th></tr>${STOK.map(s=>`<tr><td>${s[0]}</td><td>${s[1]>0?`<span class="cip ok">Stokta · ${s[1]}</span>`:`<span class="cip h">Tükendi</span>`}</td><td>${s[1]>0?`<button class="btn kc" onclick="toast('Sepete eklendi: ${s[0]}')">Sepete ekle</button>`:`<button class="btn ik kc" onclick="toast('Gelince haber verilecek: ${s[0]}')">Gelince haber ver</button>`}</td></tr>`).join("")}</table></div>
 <div class="k" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><b>🔁 Filament aboneliği</b><div class="g" style="font-size:14px">Baskı saatinize göre ayda 6 kg PLA+ otomatik gönderilsin, %8 indirimli.</div></div><button class="btn" onclick="toast('Abonelik başlatıldı · her ayın 5\\'inde kargoda')">Aboneliği başlat</button></div>`}
function kil(){$("#ic").innerHTML=`<h2>Kılavuzlar ve eğitim</h2><div class="makine">${[["M50 kurulum ve ilk baskı","Video · 12 dk"],["Nozül değişimi adım adım","Video · 6 dk"],["ULTEM ile baskı ayarları","PDF · 8 sayfa"],["D-400 reçine bakımı","Video · 9 dk"],["Dilimleme profilleri (Cura/Orca)","İndir · .zip"],["Operatör sertifika eğitimi","Canlı · 2 saat"]].map(x=>`<div class="k"><b>${x[0]}</b><div class="g" style="font-size:13px">${x[1]}</div><button class="btn ik kc" style="margin-top:8px" onclick="toast('Açılıyor: ${x[0]}')">Aç</button></div>`).join("")}</div>`}
// ---- PANEL ----
const TEK=[["yeni","Yeni talep",[["Atlas Kalıp","M50 ×2","Sihirbaz: 450 mm, CF"],["Gazi Üni. Lab","M30","Eğitim"],["Tekno Savunma","CT-1000","Acil"],["Dental Plus","D-400","Medikal"]]],["gor","Görüşüldü",[["Bursa Oto Yedek","M50","Demo istedi"]]],["dem","Demo / numune",[["Ankara Makina","M30","Numune baskı yolda"]]],["tek","Teklif verildi",[["Konya Döküm","CT-1000","PDF teklif · 2 gün"]]],["kaz","Kazanıldı ✓",[["Atlas Kalıp","M50","Kurulum 14 Eki"]]]];
function ozet(){$("#ic").innerHTML=`<h2>Genel bakış</h2><div class="kpi"><div><span class="g">Açık teklif</span><b>8</b></div><div><span class="g">Bu ay satış</span><b>3 makine</b></div><div><span class="g">Açık servis</span><b>2</b><span class="cip uy">1 acil</span></div><div><span class="g">Baskı hizmeti siparişi</span><b>27</b></div></div>
 <div class="iki"><div class="k"><h3>Talep kaynakları (30 gün)</h3>${[["Web sitesi sihirbazı",38],["Google Haritalar",24],["Instagram",16],["Baskı hizmeti → makine",12],["Fuar / bayi",10]].map(([a,v])=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between"><span>${a}</span><b>%${v}</b></div><div class="bar"><i style="width:${v*2.4}%;background:linear-gradient(90deg,var(--a),#ffb000)"></i></div></div>`).join("")}</div>
 <div class="k"><h3>Bugün yapılacaklar</h3><table>${[["Tekno Savunma'yı ara","CT-1000 acil talep"],["D-400 bakım gecikmesi","Atlas Kalıp · randevu ver"],["Porima TPU stok 0","Tedarikçiye sipariş"],["Konya Döküm teklif takibi","2 gündür cevap yok"]].map(r=>`<tr><td><b>${r[0]}</b><div class="g" style="font-size:12px">${r[1]}</div></td><td><button class="btn kc" onclick="toast('Tamamlandı olarak işaretlendi')">✓</button></td></tr>`).join("")}</table></div></div>`}
function teklif(){$("#ic").innerHTML=`<h2>Teklif hunisi</h2><p class="g">Sitedeki "Teklif Al" ve sihirbaz seçimleri buraya düşer; hiçbir talep e-posta kutusunda kaybolmaz.</p><div class="huni">${TEK.map(([k,a,l])=>`<div class="kol"><h4>${a}<span class="cip">${l.length}</span></h4>${l.map(x=>`<div class="kart"><b>${x[0]}</b><div>${x[1]}</div><div class="g" style="font-size:12px">${x[2]}</div>${k==="yeni"||k==="dem"?`<button class="btn ik kc" style="margin-top:6px" onclick="pdf('${x[0]}','${x[1]}')">PDF teklif hazırla</button>`:""}</div>`).join("")}</div>`).join("")}</div><div id="pdf"></div>`}
function pdf(f,m){$("#pdf").innerHTML=`<div class="k" style="margin-top:14px;max-width:640px"><div style="display:flex;justify-content:space-between"><b style="font:700 20px 'Space Grotesk'">CCH<span style="color:var(--a)">.</span> FİYAT TEKLİFİ</b><span class="g">No: T-${Math.floor(Math.random()*900+100)} · ${gun(0)}</span></div><p><b>${f}</b> için ${m} endüstriyel 3D yazıcı</p><table><tr><td>${m} + kurulum + eğitim</td><td style="text-align:right">Fiyatınızı girin</td></tr><tr><td>2 yıl yerinde garanti</td><td style="text-align:right">Dahil</td></tr><tr><td>10 yıl yedek parça garantisi</td><td style="text-align:right">Dahil</td></tr><tr><td>Başlangıç filament paketi</td><td style="text-align:right">Hediye</td></tr></table><div style="display:flex;gap:8px;margin-top:10px"><button class="btn kc" onclick="toast('PDF oluşturuldu ve müşteriye e-posta + WhatsApp ile gönderildi')">Müşteriye gönder</button><button class="btn ik kc" onclick="window.print()">Yazdır</button></div></div>`;$("#pdf").scrollIntoView({behavior:"smooth"})}
function servis(){$("#ic").innerHTML=`<h2>Servis masası</h2><table><tr><th>No</th><th>Müşteri / makine</th><th>Konu</th><th>SLA</th><th>Durum</th><th></th></tr>${[...TALEP.map(t=>["Atlas Kalıp",t]),["Gazi Üni. Lab",{no:"SRV-2288",mak:"M30",kat:"Tabla seviyeleme",dur:"Yeni"}]].map(([m,t])=>`<tr><td><b>${t.no}</b></td><td>${m}<div class="g" style="font-size:12px">${t.mak}</div></td><td>${t.kat}</td><td>${t.dur==="Tamamlandı"?"—":t.dur==="Yeni"?'<span class="cip h">1 sa 40 dk kaldı</span>':'<span class="cip uy">bugün</span>'}</td><td><span class="cip ${t.dur==="Tamamlandı"?"ok":"a"}">${t.dur}</span></td><td>${t.dur!=="Tamamlandı"?`<button class="btn kc" onclick="toast('Teknisyen atandı · müşteriye WhatsApp gitti')">Ata</button>`:""}</td></tr>`).join("")}</table>`}
function stok(){$("#ic").innerHTML=`<h2>Canlı stok</h2><div class="uyari">Google'daki bir yorumda müşteri, sitede <b>stokta görünen TPU</b>'yu sipariş edip ürünün olmadığını 3 gün sonra öğrendiğini yazmış. Bu panelde depo sayımı ile site stoğu sürekli eşleşir; fark çıkınca ürün satışa otomatik kapanır ve size uyarı gelir.</div>
 <div class="k"><table><tr><th>Ürün</th><th>Depo</th><th>Sitede görünen</th><th>Durum</th></tr>${STOK.map((s,i)=>`<tr><td>${s[0]}</td><td><b>${s[1]}</b></td><td>${s[2]}</td><td>${s[1]===s[2]?'<span class="cip ok">Eşleşti</span>':`<span class="cip h">Fark: ${s[2]-s[1]}</span> <button class="btn kc" onclick="STOK[${i}][2]=STOK[${i}][1];stok();toast('Site stoğu düzeltildi${s[1]===0?"; ürün satışa kapatıldı, bekleyen siparişe otomatik bilgi gitti":""}')">Eşitle</button>`}</td></tr>`).join("")}</table></div>`}
function garanti(){$("#ic").innerHTML=`<h2>Garanti ve yenileme fırsatları</h2><p class="g">Garantisi bitmek üzere olan makineler = uzatılmış garanti ve bakım sözleşmesi satışı.</p><div class="k"><table><tr><th>Müşteri</th><th>Makine</th><th>Garanti bitişi</th><th></th></tr>${[["Atlas Kalıp","D-400",170],["Bursa Oto Yedek","M50",41],["Gazi Üni. Lab","M30",18],["Ankara Makina","X30",7]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${gun(r[2])} <span class="cip ${r[2]<30?"h":"uy"}">${r[2]} gün</span></td><td><button class="btn kc" onclick="toast('Uzatılmış garanti teklifi ${r[0]} firmasına gönderildi')">Teklif gönder</button></td></tr>`).join("")}</table></div>`}
mod("mus");
</script></body></html>
